<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="Tailwind Starter" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link as="style" href="/assets/fonts.css" rel="preload"/>
    <link as="style" href="/assets/root-vars.css" rel="preload"/>
    <link as="style" href="../styles.css" rel="preload"/>
    <link href="/assets/fonts.css" rel="stylesheet">
    <link href="/assets/root-vars.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>World Cup 2026</title>
</head>
<body class="min-h-dvh flex flex-col justify-center">
    <header>
        <div class="header-container">
            <a href="/">
                <picture class="header-logo">
                    <source srcset="/images/GWD-logo.webp" type="image/webp">
                    <img class="w-auto" src="/images/GWD-logo.png" width="358" height="470" alt="World Cup 2026">
                </picture>
            </a>
        </div>
    </header>
    <main>
        <section class="screen screen--4">
            <div class="screen__wrapper">
                <div class="px-4 text-(--color-lighter-green)">
                    <h1 class="h4 text-(--color-light-green)"> Μουσικό Challenge</h1>
                </div>
                <img src="/images/screen-elements-left.svg" width="757" height="859" alt="Screen Elements Left" class="screen__elements-left">
                <img src="/images/screen-elements-right.svg" width="416" height="953" alt="Screen Elements Right" class="screen__elements-right">
                <div class="h5 mt-auto mb-0">
                    Ο τυχερός νικητής είναι:
                </div>
                <div class="screen__user-code text-[200px] font-bold">3657</div>
                <picture class="screen__bg">
                    <source srcset="/images/hero-bg.webp" type="image/webp">
                    <img src="/images/hero-bg.png" alt="Hero Image" width="2880" height="1652">
                </picture>
            </div>
        </section>
    </main>
    <footer class="footer--screens">
        <a href="#" aria-label="ΕΛΕΤΑΕΝ" target="_blank">
            <picture>
                <source srcset="/images/eletaen-logo-small.webp" type="image/webp">
                <img src="/images/eletaen-logo-small.png" width="232" height="76" alt="ΕΛΕΤΑΕΝ">
            </picture>
        </a>
    </footer>
</body>
<script src="../main.js" type="module"></script>
</html>
