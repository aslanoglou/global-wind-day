<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Tailwind Starter" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link as="style" href="/assets/fonts.css" rel="preload"/>
    <link as="style" href="/assets/root-vars.css" rel="preload"/>
    <link as="style" href="../styles.css" rel="preload"/>
    <link href="/assets/fonts.css" rel="stylesheet">
    <link href="/assets/root-vars.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <link href="/images/favicon.png" rel="icon" type="image/png">
    <title>World Cup 2026</title>
</head>
<body class="min-h-dvh flex flex-col justify-center">
<header>
    <div class="header-container">
        <a href="/">
            <picture class="header-logo">
                <source srcset="/images/GWD-logo.webp" type="image/webp">
                <img alt="World Cup 2026" class="w-auto" height="470" src="/images/GWD-logo.png" width="358">
            </picture>
        </a>
    </div>
</header>
<main>
    <section class="screen screen--4">
        <div class="screen__wrapper">
            <div class="px-4 text-(--color-lighter-green)">
                <h1 class="h4 mb-0 text-(--color-light-green)">Μουσικό Challenge</h1>
            </div>
            <div class="h5 mb-0 mt-12">
                Ο τυχερός νικητής είναι:
            </div>
            <div class="screen__user-code text-[200px] font-bold mb-12" data-final-code="3657">0000</div>
            <picture class="screen__bg">
                <source srcset="/images/hero-bg.webp" type="image/webp">
                <img alt="Hero Image" height="1652" src="/images/hero-bg.png" width="2880">
            </picture>
            <img alt="Screen Elements Left" class="screen__elements-left" height="859" src="/images/screen-elements-left.svg"
                 width="757">
            <img alt="Screen Elements Right" class="screen__elements-right" height="953" src="/images/screen-elements-right.svg"
                 width="416">
        </div>
    </section>
</main>
<footer class="footer--screens">
    <a aria-label="ΕΛΕΤΑΕΝ" href="#" target="_blank">
        <picture>
            <source srcset="/images/eletaen-logo-small.webp" type="image/webp">
            <img alt="ΕΛΕΤΑΕΝ" height="76" src="/images/eletaen-logo-small.png" width="232">
        </picture>
    </a>
</footer>
</body>
<script src="../main.js" type="module"></script>
</html>
