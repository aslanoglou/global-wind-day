<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="Tailwind Starter" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link as="style" href="/assets/fonts.css" rel="preload"/>
    <link as="style" href="/assets/root-vars.css" rel="preload"/>
    <link as="style" href="../styles.css" rel="preload"/>
    <link href="/assets/fonts.css" rel="stylesheet">
    <link href="/assets/root-vars.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>World Cup 2026</title>
</head>
<body class="min-h-dvh flex flex-col justify-center">
    <header>
        <div class="header-container">
            <a href="/">
                <picture class="header-logo">
                    <source srcset="/images/GWD-logo.webp" type="image/webp">
                    <img class="w-auto" src="/images/GWD-logo.png" width="358" height="470" alt="World Cup 2026">
                </picture>
            </a>
        </div>
    </header>
    <main>
        <section class="screen screen--1">
            <div class="screen__wrapper">
                <div class="px-4 text-(--color-lighter-green)">
                    <h1 class="h3">Μουσικό Challenge</h1>
                </div>
                <img src="/images/screen-elements-left.svg" width="757" height="859" alt="Screen Elements Left" class="screen__elements-left">
                <img src="/images/screen-elements-right.svg" width="416" height="953" alt="Screen Elements Right" class="screen__elements-right">
                <picture class="screen__bg">
                    <source srcset="/images/screen-klaudia.webp" type="image/webp">
                    <img src="/images/screen-klaudia.png" alt="Hero Image" width="1881" height="943">
                </picture>
                <a href="/screen-2/" class="screen__arrow-link">
                    <span>To sountrack της βραδιάς</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="18" fill="none" viewBox="0 0 26 18">
                        <path fill="currentColor" d="M17.501.326a.92.92 0 0 0-.668-.325.94.94 0 0 0-.696.265.9.9 0 0 0-.27.682.9.9 0 0 0 .332.655l6.645 6.523H.878a.94.94 0 0 0-.624.283.9.9 0 0 0 0 1.251c.164.169.387.27.624.282h21.966l-6.656 6.516a.915.915 0 0 0 0 1.277.92.92 0 0 0 .652.265.94.94 0 0 0 .65-.265l8.233-8.071A.9.9 0 0 0 26 9.025a.87.87 0 0 0-.277-.638z"/>
                    </svg>
                </a>
            </div>
        </section>
    </main>
    <footer class="footer--screens">
        <a href="#" aria-label="ΕΛΕΤΑΕΝ" target="_blank">
            <picture>
                <source srcset="/images/eletaen-logo-small.webp" type="image/webp">
                <img src="/images/eletaen-logo-small.png" width="232" height="76" alt="ΕΛΕΤΑΕΝ">
            </picture>
        </a>
    </footer>
</body>
<script src="../main.js" type="module"></script>
</html>
